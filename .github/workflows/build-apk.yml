name: Build Basmati APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses
          sdkmanager --install "platforms;android-35" "build-tools;35.0.0"

      - name: Extract project
        run: |
          unzip -o Basmati_Phone_Build_Salary_Date.zip
     
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          gradle -p BasmatiAndroid assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: Basmati-APK
          path: BasmatiAndroid/app/build/outputs/apk/debug/app-debug.apk
